services:
  - type: web
    name: cleanreport-api
    runtime: docker
    repo: https://github.com/BOUTCHOUANG1/axion-circle
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://cleanreport-frontend.vercel.app,http://localhost:3000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
