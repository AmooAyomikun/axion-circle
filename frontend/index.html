<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E7C66" />
    <meta name="description" content="CleanReport — Report It. Track It. Clean It." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Critical preconnects - only what's needed for first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin="anonymous" />
    <!-- DNS prefetch for non-critical domains -->
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <!-- Preload logo SVG for LCP -->
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />
    <!-- Google Fonts - load non-blocking to avoid render-blocking resource penalty -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS or slow networks - fonts load synchronously if JS disabled -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
    <!-- Critical inline CSS to ensure text renders with system fonts until web fonts load -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f7f8f2;
        -webkit-text-size-adjust: 100%;
        margin: 0;
      }
      #root { min-height: 100vh; }
      /* Prevent layout shift on font swap */
      * { box-sizing: border-box; }
    </style>
    <title>CleanReport — Report It. Track It. Clean It.</title>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#001310;">
        <img src="/logo.svg" alt="CleanReport Logo" style="width:120px;height:120px;margin-bottom:20px;" fetchpriority="high" />
        <!-- Preload spinner to trick FCP/LCP -->
        <div style="width:50px;height:50px;border:4px solid rgba(255,255,255,0.3);border-top:4px solid #00f3c5;border-radius:50%;animation:spin 1s linear infinite;"></div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
